name: CI

on: push

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: ["", --all-features]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace ${{ matrix.features }}

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools, rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: |
          cargo llvm-cov \
            --workspace \
            --all-features \
            --ignore-filename-regex /examples/ \
            --fail-under-lines 100 \
            --fail-under-functions 100

  examples:
    runs-on: ubuntu-latest
    env:
      SYSTEM2_OFFLINE: 1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Replay quick_start from its recording
        env:
          SYSTEM2_CACHE: examples/quick_start/responses.jsonl
        run: cargo run -p quick_start
      - name: Replay find_in_image from its recording
        env:
          SYSTEM2_CACHE: examples/find_in_image/responses.jsonl
        run: |
          cargo run -p find_in_image --features image -- \
            examples/find_in_image/data/desk.jpg "the coffee cup" draw target/cup.jpg
          cargo run -p find_in_image --features image -- \
            examples/find_in_image/data/desk.jpg "a cat" draw target/cat.jpg

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

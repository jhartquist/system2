[workspace]
members = ["system2", "system2-shared", "system2-macros", "examples/*"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
float_cmp = "allow"

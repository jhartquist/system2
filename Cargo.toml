[workspace]
members = ["system2", "system2-macros"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
missing_errors_doc = "allow"
float_cmp = "allow"

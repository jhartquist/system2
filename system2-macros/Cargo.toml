[package]
name = "system2-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The macros of system2."
license = "MIT OR Apache-2.0"
repository = "https://github.com/jhartquist/system2"
readme = "../README.md"

[package.metadata.docs.rs]
all-features = true

[lib]
proc-macro = true

[lints]
workspace = true

[features]
image = ["system2-shared/image"]

[dependencies]
proc-macro2 = "1"
quote = "1"
serde_json = "1"
system2-shared = { version = "=0.1.0", path = "../system2-shared" }
syn = { version = "2", features = ["full"] }

[dev-dependencies]
system2 = { path = "../system2" }

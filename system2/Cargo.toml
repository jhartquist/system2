[package]
name = "system2"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "System 2 decisions from System 1 judgments."
license = "MIT OR Apache-2.0"
repository = "https://github.com/jhartquist/system2"
keywords = ["jev", "typesafe", "llm", "decision"]
categories = ["api-bindings", "asynchronous"]

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
system2-macros = { version = "0.1.0", path = "../system2-macros" }
thiserror = "2"
zstd = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "time"] }
trybuild = "1"
wiremock = "0.6"
